// Modos de câmera: lateral de TV, lateral aproximada e tática original.

function updateBroadcastCamera(dt){

 const t=1-Math.exp(-dt*3.0);
 const leadZ=THREE.MathUtils.clamp(focus.z+(attached?-4:velocity.z*.25),-33,33);

  // Lateral elevada, enquadra o campo e preserva a direção dos ataques.
  cameraPosition.set(80,54,leadZ*.62);
  cameraTarget.set(leadX*.30,0,leadZ);
  camera.fov=53;

  cameraPosition.set(63,37,leadZ*.78);

  cameraTarget.set(player.position.x*.35,0,player.position.z-13);
