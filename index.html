// A setinha usa exatamente a mesma transformação de direção do movimento.
function analogDirection(){
 const ix=input.x+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);
 const iz=input.z+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
 const strength=Math.hypot(ix,iz);
 if(strength<.08)return null;
 const m=camera.matrixWorld.elements;
 let rx=m[0],rz=m[2],ux=m[4],uz=m[6];
 const rl=Math.hypot(rx,rz)||1,ul=Math.hypot(ux,uz)||1;
 rx/=rl;rz/=rl;ux/=ul;uz/=ul;
 const dx=ix*rx-iz*ux,dz=ix*rz-iz*uz;
 const len=Math.hypot(dx,dz)||1;
 return {x:dx/len,z:dz/len};
}
