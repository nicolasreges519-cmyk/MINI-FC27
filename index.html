import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x82bad6);const camera=new THREE.PerspectiveCamera(56,innerWidth/innerHeight,.1,300);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x42613a,2));const sun=new THREE.DirectionalLight(0xffffff,1.3);sun.position.set(-20,35,15);scene.add(sun);
const pitch=new THREE.Mesh(new THREE.PlaneGeometry(64,100),new THREE.MeshLambertMaterial({color:0x258343}));pitch.rotation.x=-Math.PI/2;scene.add(pitch);const white=new THREE.LineBasicMaterial({color:0xffffff});function draw(points){scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(points.map(([x,z])=>new THREE.Vector3(x,.035,z))),white))}draw([[-30,-48],[30,-48],[30,48],[-30,48],[-30,-48]]);draw([[-30,0],[30,0]]);let circle=[];for(let i=0;i<=72;i++){let a=i*2*Math.PI/72;circle.push([9.15*Math.cos(a),9.15*Math.sin(a)])}draw(circle);for(const s of [-1,1]){const z=s*48;draw([[-20,z],[-20,z-s*16],[20,z-s*16],[20,z]]);draw([[-9,z],[-9,z-s*6],[9,z-s*6],[9,z]])}function goal(z){const mat=new THREE.MeshBasicMaterial({color:0xffffff});for(const [x,y,w,h] of [[-4,1.5,.18,3],[4,1.5,.18,3],[0,3,8,.18]]){const bar=new THREE.Mesh(new THREE.BoxGeometry(w,h,.18),mat);bar.position.set(x,y,z);scene.add(bar)}}goal(-48);goal(48);
const animatedPlayers=[];
function person(x,z,color){
 const g=new THREE.Group();const kit=new THREE.MeshLambertMaterial({color});const skin=new THREE.MeshLambertMaterial({color:0xc98c67});const shorts=new THREE.MeshLambertMaterial({color:0x17233b});const sock=new THREE.MeshLambertMaterial({color:color});const boots=new THREE.MeshLambertMaterial({color:0x141414});const hair=new THREE.MeshLambertMaterial({color:0x1b1716});
 function shape(parent,geo,mat,x,y,z){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);parent.add(m);return m}
 const torso=shape(g,new THREE.BoxGeometry(.92,1.02,.48),kit,0,1.62,0);shape(g,new THREE.BoxGeometry(.85,.4,.5),shorts,0,.95,0);
 const neck=shape(g,new THREE.CylinderGeometry(.15,.17,.18,8),skin,0,2.25,0);
 shape(g,new THREE.SphereGeometry(.34,12,10),skin,0,2.55,0);shape(g,new THREE.SphereGeometry(.34,12,8,0,Math.PI*2,0,Math.PI*.48),hair,0,2.66,0);
 for(const s of [-1,1]){shape(g,new THREE.SphereGeometry(.065,8,6),new THREE.MeshLambertMaterial({color:0x151515}),s*.13,2.56,-.29)}
 const limbs=[];
 for(const s of [-1,1]){
   const arm=new THREE.Group();arm.position.set(s*.59,2.01,0);g.add(arm);shape(arm,new THREE.CylinderGeometry(.16,.13,.74,8),kit,0,-.35,0);shape(arm,new THREE.SphereGeometry(.13,8,8),skin,0,-.76,0);limbs.push(arm);
   const leg=new THREE.Group();leg.position.set(s*.24,.82,0);g.add(leg);shape(leg,new THREE.CylinderGeometry(.19,.14,.78,8),skin,0,-.35,0);shape(leg,new THREE.CylinderGeometry(.145,.13,.36,8),sock,0,-.82,0);shape(leg,new THREE.BoxGeometry(.29,.18,.48),boots,0,-1.06,-.12);limbs.push(leg);
 }
 g.position.set(x,.35,z);scene.add(g);g.userData={limbs,phase:Math.random()*6.28,lastX:x,lastZ:z,kickTime:0};animatedPlayers.push(g);return g
}
function animatePlayers(dt){for(const g of animatedPlayers){const d=g.userData;const speed=Math.min(1,Math.hypot(g.position.x-d.lastX,g.position.z-d.lastZ)/Math.max(.001,dt)/8);d.phase+=dt*(3+speed*9);const stride=Math.sin(d.phase)*.58*speed;d.limbs[0].rotation.x=-stride*.8;d.limbs[1].rotation.x=stride;d.limbs[2].rotation.x=stride*.8;d.limbs[3].rotation.x=-stride;d.kickTime=Math.max(0,d.kickTime-dt);if(d.kickTime>0)d.limbs[1].rotation.x=-1.1*Math.sin((.3-d.kickTime)/.3*Math.PI);d.lastX=g.position.x;d.lastZ=g.position.z}}
const player=person(0,12,0x2072ff);[[-15,5],[15,5],[0,28]].forEach(p=>person(...p,0x2072ff));const foes=[[-12,-13],[12,-13],[0,-28],[0,-40]].map(p=>person(...p,0xf04747));// Goleiros independentes: patrulham a linha do gol e reagem a chutes.
const keepers=[person(0,-45.5,0xffd23f),person(0,45.5,0x4be0b6)];
for(const k of keepers){
 k.userData.isKeeper=true;k.userData.saveTime=0;k.userData.diveDir=0;
 const gloveMat=new THREE.MeshLambertMaterial({color:0xf9f9f9});
 for(const arm of [k.userData.limbs[0],k.userData.limbs[2]]){
  const glove=new THREE.Mesh(new THREE.BoxGeometry(.27,.24,.26),gloveMat);glove.position.set(0,-.8,0);arm.add(glove)
 }
}
function animateKeepers(dt){
 for(let i=0;i<keepers.length;i++){
  const k=keepers[i],homeZ=i===0?-45.5:45.5;
  const near=Math.abs(ball.position.z-homeZ)<23;
  const targetX=near?THREE.MathUtils.clamp(ball.position.x,-3.5,3.5):0;
  k.position.x+=THREE.MathUtils.clamp(targetX-k.position.x,-dt*6.2,dt*6.2);
  k.position.z=homeZ;
  k.userData.saveTime=Math.max(0,k.userData.saveTime-dt);
  if(k.userData.saveTime>0){
   const t=k.userData.saveTime/.6;
   k.rotation.z=k.userData.diveDir*.65*Math.sin(Math.PI*t);
   k.userData.limbs[0].rotation.z=-1.15;
   k.userData.limbs[2].rotation.z=1.15;
  }else{k.rotation.z=0}
  if(!attached&&cooldown<.48&&Math.abs(ball.position.z-homeZ)<1.8&&Math.abs(ball.position.x-k.position.x)<1.5){
   const direction=i===0?1:-1;
   velocity.set((ball.position.x-k.position.x)*5+(Math.random()-.5)*3,0,direction*17);
   ball.position.z=homeZ+direction*1.9;
   k.userData.saveTime=.6;k.userData.diveDir=ball.position.x>=k.position.x?-1:1;
   banner.textContent='DEFESA!';bannerTime=1.2;
  }
 }
}
const ball=new THREE.Mesh(new THREE.SphereGeometry(.37,16,12),new THREE.MeshLambertMaterial({color:0xffffff}));scene.add(ball);let velocity=new THREE.Vector3(),input={x:0,z:0},keys={},scores=[0,0],elapsed=0,last=performance.now(),attached=true,cooldown=0,bannerTime=0;const scoreEl=document.getElementById('score'),clockEl=document.getElementById('clock'),banner=document.getElementById('banner');function kickoff(){player.position.set(0,0,12);ball.position.set(0,.37,10.8);velocity.set(0,0,0);attached=true;foes.forEach((p,i)=>p.position.set([-12,12,0,0][i],0,[-13,-13,-28,-40][i]));keepers.forEach((k,i)=>{k.position.set(0,.35,i===0?-45.5:45.5);k.rotation.z=0;k.userData.saveTime=0})}function kick(power){if(Math.hypot(ball.position.x-player.position.x,ball.position.z-player.position.z)>2.5)return;let dx=input.x,dz=input.z;if(Math.hypot(dx,dz)<.2){dx=0;dz=-1}const len=Math.hypot(dx,dz);velocity.set(dx/len*power,0,dz/len*power);attached=false;cooldown=.55;player.userData.kickTime=.3}document.getElementById('shoot').addEventListener('pointerdown',e=>{e.preventDefault();kick(34)});document.getElementById('pass').addEventListener('pointerdown',e=>{e.preventDefault();kick(16)});const joy=document.getElementById('joy'),stick=document.getElementById('stick');function joystick(e){const r=joy.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dz=e.clientY-r.top-r.height/2,dist=Math.hypot(dx,dz),limit=r.width*.32,scale=Math.min(dist,limit)/Math.max(1,dist);stick.style.transform=`translate(${dx*scale}px,${dz*scale}px)`;input.x=dx/Math.max(limit,dist);input.z=dz/Math.max(limit,dist)}joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);joystick(e)});joy.addEventListener('pointermove',e=>{if(joy.hasPointerCapture(e.pointerId))joystick(e)});function stop(){input.x=0;input.z=0;stick.style.transform=''}joy.addEventListener('pointerup',stop);joy.addEventListener('pointercancel',stop);window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'){e.preventDefault();kick(34)}if(e.key.toLowerCase()==='e')kick(16)});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);document.getElementById('restart').onclick=()=>{scores=[0,0];elapsed=0;scoreEl.textContent='0 × 0';kickoff()};function tick(now){requestAnimationFrame(tick);const dt=Math.min((now-last)/1000,.05);last=now;elapsed+=dt;cooldown=Math.max(0,cooldown-dt);bannerTime-=dt;if(bannerTime<=0)banner.textContent='';let dx=input.x+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dz=input.z+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);const len=Math.hypot(dx,dz);if(len>.05){dx/=len;dz/=len;player.position.x=THREE.MathUtils.clamp(player.position.x+dx*11*dt,-29,29);player.position.z=THREE.MathUtils.clamp(player.position.z+dz*11*dt,-47,47);player.rotation.y=Math.atan2(-dx,-dz)}if(attached){ball.position.set(player.position.x,.37,player.position.z-1.15)}else{ball.position.addScaledVector(velocity,dt);velocity.multiplyScalar(Math.exp(-1.25*dt));if(Math.abs(ball.position.x)>29.6){ball.position.x=THREE.MathUtils.clamp(ball.position.x,-29.6,29.6);velocity.x*=-.6}if(Math.hypot(ball.position.x-player.position.x,ball.position.z-player.position.z)<1.3&&cooldown===0&&velocity.length()<12)attached=true}for(const f of foes){const target=attached?player.position:ball.position;const fx=target.x-f.position.x,fz=target.z-f.position.z,dist=Math.hypot(fx,fz);if(dist>2){f.position.x+=fx/dist*dt*3.4;f.position.z+=fz/dist*dt*3.4}if(dist<1.15&&attached){attached=false;velocity.set((Math.random()-.5)*8,0,15)}}animateKeepers(dt);if(Math.abs(ball.position.z)>48){if(Math.abs(ball.position.x)<4){scores[ball.position.z<0?0:1]++;scoreEl.textContent=scores.join(' × ');banner.textContent='GOOOL!';bannerTime=2}kickoff()}const sec=Math.floor(elapsed*4);clockEl.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');animatePlayers(dt);camera.position.lerp(new THREE.Vector3(player.position.x*.35,38,player.position.z+34),.07);camera.lookAt(player.position.x*.35,0,player.position.z-13);renderer.render(scene,camera)}window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});kickoff();requestAnimationFrame(tick);
