<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>MINI FC27</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#081622;color:white;font-family:Arial,sans-serif;touch-action:none}canvas{display:block}#hud{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#081728df;padding:10px 16px;border-radius:12px;font-weight:bold;white-space:nowrap;z-index:2}#tip{position:absolute;top:12px;left:12px;font-size:12px;color:#e0e7ef}#joy{position:absolute;bottom:22px;left:22px;width:112px;height:112px;border:3px solid #ffffff8a;border-radius:50%;background:#ffffff22;touch-action:none}#stick{position:absolute;width:42px;height:42px;left:32px;top:32px;background:#ffffffa8;border-radius:50%}#buttons{position:absolute;bottom:24px;right:20px;display:flex;gap:12px;align-items:end}button{border:2px solid #ffffff88;border-radius:50%;background:#2863cfda;color:white;font-weight:800;width:75px;height:75px;touch-action:none}#pass{width:66px;height:66px;background:#119568dd}#restart{position:absolute;right:12px;top:62px;width:auto;height:auto;border-radius:10px;padding:8px 12px;background:#132742}#banner{position:absolute;top:28%;width:100%;text-align:center;font-size:36px;font-weight:900;text-shadow:0 3px 8px #000;pointer-events:none}#error{position:absolute;top:50%;left:10%;width:80%;text-align:center;color:#fff;background:#9b2630;padding:12px;display:none}@media(max-width:600px){#tip{display:none}#hud{font-size:12px;padding:8px}#buttons button{width:63px;height:63px}}</style></head><body><div id="hud">AZUL <span id="score">0 × 0</span> VERMELHO · <span id="clock">00:00</span></div><div id="tip">MINI FC27 · WASD/setas para mover · Espaço para chutar · E para passar</div><button id="restart">Reiniciar</button><div id="banner"></div><div id="joy"><div id="stick"></div></div><div id="buttons"><button id="pass">PASSE</button><button id="shoot">CHUTE</button></div><div id="error"></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x82bad6);const camera=new THREE.PerspectiveCamera(56,innerWidth/innerHeight,.1,300);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x42613a,2));const sun=new THREE.DirectionalLight(0xffffff,1.3);sun.position.set(-20,35,15);scene.add(sun);
const pitch=new THREE.Mesh(new THREE.PlaneGeometry(64,100),new THREE.MeshLambertMaterial({color:0x258343}));pitch.rotation.x=-Math.PI/2;scene.add(pitch);const white=new THREE.LineBasicMaterial({color:0xffffff});function draw(points){scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(points.map(([x,z])=>new THREE.Vector3(x,.035,z))),white))}draw([[-30,-48],[30,-48],[30,48],[-30,48],[-30,-48]]);draw([[-30,0],[30,0]]);let circle=[];for(let i=0;i<=72;i++){let a=i*2*Math.PI/72;circle.push([9.15*Math.cos(a),9.15*Math.sin(a)])}draw(circle);for(const s of [-1,1]){const z=s*48;draw([[-20,z],[-20,z-s*16],[20,z-s*16],[20,z]]);draw([[-9,z],[-9,z-s*6],[9,z-s*6],[9,z]])}function goal(z){const mat=new THREE.MeshBasicMaterial({color:0xffffff});for(const [x,y,w,h] of [[-4,1.5,.18,3],[4,1.5,.18,3],[0,3,8,.18]]){const bar=new THREE.Mesh(new THREE.BoxGeometry(w,h,.18),mat);bar.position.set(x,y,z);scene.add(bar)}}goal(-48);goal(48);
function person(x,z,color){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.CylinderGeometry(.48,.65,1.55,10),new THREE.MeshLambertMaterial({color}));body.position.y=1.17;g.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.35,12,10),new THREE.MeshLambertMaterial({color:0xd6a27c}));head.position.y=2.2;g.add(head);g.position.set(x,0,z);scene.add(g);return g}const player=person(0,12,0x2072ff);[[-15,5],[15,5],[0,28]].forEach(p=>person(...p,0x2072ff));const foes=[[-12,-13],[12,-13],[0,-28],[0,-40]].map(p=>person(...p,0xf04747));const ball=new THREE.Mesh(new THREE.SphereGeometry(.37,16,12),new THREE.MeshLambertMaterial({color:0xffffff}));scene.add(ball);let velocity=new THREE.Vector3(),input={x:0,z:0},keys={},scores=[0,0],elapsed=0,last=performance.now(),attached=true,cooldown=0,bannerTime=0;const scoreEl=document.getElementById('score'),clockEl=document.getElementById('clock'),banner=document.getElementById('banner');function kickoff(){player.position.set(0,0,12);ball.position.set(0,.37,10.8);velocity.set(0,0,0);attached=true;foes.forEach((p,i)=>p.position.set([-12,12,0,0][i],0,[-13,-13,-28,-40][i]))}function kick(power){if(Math.hypot(ball.position.x-player.position.x,ball.position.z-player.position.z)>2.5)return;let dx=input.x,dz=input.z;if(Math.hypot(dx,dz)<.2){dx=0;dz=-1}const len=Math.hypot(dx,dz);velocity.set(dx/len*power,0,dz/len*power);attached=false;cooldown=.55}document.getElementById('shoot').addEventListener('pointerdown',e=>{e.preventDefault();kick(34)});document.getElementById('pass').addEventListener('pointerdown',e=>{e.preventDefault();kick(16)});const joy=document.getElementById('joy'),stick=document.getElementById('stick');function joystick(e){const r=joy.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dz=e.clientY-r.top-r.height/2,dist=Math.hypot(dx,dz),limit=r.width*.32,scale=Math.min(dist,limit)/Math.max(1,dist);stick.style.transform=`translate(${dx*scale}px,${dz*scale}px)`;input.x=dx/Math.max(limit,dist);input.z=dz/Math.max(limit,dist)}joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);joystick(e)});joy.addEventListener('pointermove',e=>{if(joy.hasPointerCapture(e.pointerId))joystick(e)});function stop(){input.x=0;input.z=0;stick.style.transform=''}joy.addEventListener('pointerup',stop);joy.addEventListener('pointercancel',stop);window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'){e.preventDefault();kick(34)}if(e.key.toLowerCase()==='e')kick(16)});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);document.getElementById('restart').onclick=()=>{scores=[0,0];elapsed=0;scoreEl.textContent='0 × 0';kickoff()};function tick(now){requestAnimationFrame(tick);const dt=Math.min((now-last)/1000,.05);last=now;elapsed+=dt;cooldown=Math.max(0,cooldown-dt);bannerTime-=dt;if(bannerTime<=0)banner.textContent='';let dx=input.x+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dz=input.z+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);const len=Math.hypot(dx,dz);if(len>.05){dx/=len;dz/=len;player.position.x=THREE.MathUtils.clamp(player.position.x+dx*11*dt,-29,29);player.position.z=THREE.MathUtils.clamp(player.position.z+dz*11*dt,-47,47);player.rotation.y=Math.atan2(-dx,-dz)}if(attached){ball.position.set(player.position.x,.37,player.position.z-1.15)}else{ball.position.addScaledVector(velocity,dt);velocity.multiplyScalar(Math.exp(-1.25*dt));if(Math.abs(ball.position.x)>29.6){ball.position.x=THREE.MathUtils.clamp(ball.position.x,-29.6,29.6);velocity.x*=-.6}if(Math.hypot(ball.position.x-player.position.x,ball.position.z-player.position.z)<1.3&&cooldown===0&&velocity.length()<12)attached=true}for(const f of foes){const target=attached?player.position:ball.position;const fx=target.x-f.position.x,fz=target.z-f.position.z,dist=Math.hypot(fx,fz);if(dist>2){f.position.x+=fx/dist*dt*3.4;f.position.z+=fz/dist*dt*3.4}if(dist<1.15&&attached){attached=false;velocity.set((Math.random()-.5)*8,0,15)}}if(Math.abs(ball.position.z)>48){if(Math.abs(ball.position.x)<4){scores[ball.position.z<0?0:1]++;scoreEl.textContent=scores.join(' × ');banner.textContent='GOOOL!';bannerTime=2}kickoff()}const sec=Math.floor(elapsed*4);clockEl.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');camera.position.lerp(new THREE.Vector3(player.position.x*.35,38,player.position.z+34),.07);camera.lookAt(player.position.x*.35,0,player.position.z-13);renderer.render(scene,camera)}window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});kickoff();requestAnimationFrame(tick);
</script></body></html>
